# Installer configuration. Every choice here that looks arbitrary is load-bearing —
# see docs/recon.md §5 for the source-level analysis behind the NSIS block.

appId: io.github.phish3144.watis # MUST equal APP_ID in src/shared/app-identity.ts
productName: WatIs # path-safe; the display name "WatIs?" never reaches a path
copyright: Copyright © 2026 phish3144

directories:
  output: release
  buildResources: build

# better-sqlite3 13 is Node-API and ships prebuilds for every target inside its npm tarball.
# Leaving this on makes electron-builder call @electron/rebuild, which hard-fails on any
# cross-arch job with "node-gyp does not support cross-compiling native modules from source".
npmRebuild: false

asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/prebuilds/**'
  # WASM and the pdf.js worker are read from disk at runtime; neither loads from inside an asar.
  - '**/node_modules/tesseract.js-core/**'
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/pdfjs-dist/**'

# Tray icons, badge digits and (later) sidecars are read from disk at runtime, so they live
# outside the asar archive. nativeImage.createFromPath cannot read from inside one.
extraResources:
  - from: resources
    to: .
    filter: ['**/*']

files:
  - out/**
  - package.json
  # better-sqlite3 carries eight platform prebuilds (~27 MB). The unwanted ones are dropped
  # per target below, NOT here: a global '!prebuilds/darwin*' would strip the macOS build of
  # the very binding it needs. Sources and build scaffolding are useless on every target.
  #
  # Negation only. An exclude-all-then-re-include pattern silently ships an app with NO
  # binding at all, and the ${platform} macro expands to the build host, not the target.
  - '!node_modules/better-sqlite3/{deps,src,build,binding.gyp}/**'

win:
  icon: build/icon.ico
  files:
    - '!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,darwin}*'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: '${productName}-${arch}.${ext}'

nsis:
  # Three independent reasons this installer cannot elevate:
  #  1. perMachine:false        -> RequestExecutionLevel user in the manifest
  #  2. oneClick:true           -> no install-mode radio page, so no reachable UAC_RunElevated
  #  3. packElevateHelper:false -> resources/elevate.exe does not exist to be called
  # oneClick:false would undo (2): it defines INSTALL_MODE_PER_ALL_USERS_REQUIRED regardless of
  # perMachine, and two of the three UAC_RunElevated call sites are NOT guarded by
  # allowElevation. The price is allowToChangeInstallationDirectory, which electron-builder
  # refuses to combine with oneClick:true. Guaranteed no-UAC wins.
  oneClick: true
  perMachine: false
  packElevateHelper: false
  allowElevation: false
  # Required for Windows toasts: the shortcut carries the AppUserModelId.
  createStartMenuShortcut: true
  createDesktopShortcut: true
  runAfterFinish: true
  # Never destroy the archive on uninstall. It can be 20 GB of the user's own history.
  deleteAppDataOnUninstall: false
  differentialPackage: true
  # Asks on uninstall whether the archive should go too, defaulting to keeping it. The script must
  # never elevate — see the header in that file and scripts/verify-no-elevate.mjs.
  include: build/installer.nsh
  # Stable name so the landing page can link straight at
  # /releases/latest/download/WatIs-Setup-x64.exe forever. The version lives in latest.yml,
  # which is what electron-updater actually reads.
  artifactName: '${productName}-Setup-${arch}.${ext}'

portable:
  artifactName: '${productName}-Portable-${arch}.${ext}'
  unpackDirName: WatIs # stable, so state written beside the exe survives a restart

linux:
  icon: build/icon.png
  # The Windows and macOS builds each drop the prebuilds they cannot use; this one keeps the Linux
  # pair and discards the rest, for the same reason — eight platform binaries is 27 MB of ballast.
  files:
    - '!node_modules/better-sqlite3/prebuilds/{win32,darwin}*'
  category: Network
  synopsis: WhatsApp Web mit lokalem, durchsuchbarem Archiv
  # AppImage and nothing else, on purpose.
  #
  # CLAUDE.md forbids system-wide installation, and a .deb or .rpm is exactly that: it needs root,
  # writes under /usr, and leaves files a user without sudo cannot remove. A snap adds a daemon and
  # confinement that would cut the app off from the download directory it is supposed to write to.
  #
  # An AppImage is one executable the user owns. What it normally lacks — a menu entry, an icon,
  # a searchable name — the application creates for itself under ~/.local/share on first run
  # (src/main/linux-integration.ts), so "portable" and "properly installed" stop being a choice.
  # electron-updater supports AppImage natively: it replaces the file in place.
  target:
    - target: AppImage
      arch: [x64]
  # Path-safe and predictable: it becomes the file name, the process name and the WM class the
  # desktop entry has to match.
  executableName: watis
  # Without this the desktop cannot link the running window to the menu entry: the dock shows a
  # generic icon beside a correctly-installed launcher, which is precisely the "installed
  # application" illusion breaking. electron-builder warns about it by name; `desktopName` lives in
  # package.json and this switch makes Electron use it as the app_id / WM_CLASS.
  syncDesktopName: true
  artifactName: '${productName}-${arch}.${ext}'
  desktop:
    entry:
      # Matches StartupWMClass in the entry the app writes for itself, so the running window is
      # associated with the launcher icon rather than appearing as a second, generic one.
      StartupWMClass: watis
      Categories: Network;InstantMessaging;

mac:
  icon: build/icon.png
  files:
    - '!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,win32}*'
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip is mandatory for electron-updater on macOS.
    - target: zip
      arch: [arm64, x64]
  minimumSystemVersion: '13.0' # Electron 44 dropped macOS 12
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Deterministic: electron-builder 26 removed the automatic ad-hoc fallback, so the default now
  # depends on whatever happens to be in the runner keychain.
  identity: null
  notarize: false

publish:
  provider: github
  owner: phish3144
  repo: watis
  # Public repo, so no token is embedded in the shipped binary.
  # Published outright rather than as a draft: a draft is invisible to
  # /releases/latest/download/, which is exactly the URL the landing page links to.
  releaseType: release
