name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macOS is build-only until signing and notarisation are decided. It runs FIRST and publishes
  # nothing: an unsigned .dmg on a release page invites people to install something macOS will
  # refuse to open. Its job is to prove the tag still builds for macOS.
  verify-mac:
    name: Verify macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run dist:mac

  release-windows:
    name: Publish Windows release
    # Serialised on purpose. Two jobs publishing to the same GitHub release in parallel race each
    # other over the release draft and its latest.yml.
    needs: verify-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run verify:no-elevate

      - name: Publish to GitHub Releases
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned by decision (ADR 0001, point 11). Auto-discovery would otherwise pick up
          # whatever happens to be in the runner keychain and make builds non-deterministic.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify the published build carries no elevation helper
        run: npm run verify:no-elevate
