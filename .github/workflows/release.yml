name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs first and takes seconds, because getting this wrong is silent and expensive.
  #
  # electron-builder derives everything from package.json, not from the tag: it builds version
  # 0.1.0, writes `version: 0.1.0` into latest.yml and publishes into a release named v0.1.0 —
  # even when the tag that started the run says v0.2.0. The result is a release page holding the
  # wrong version under the right name, and every installed client reading a latest.yml that says
  # it is already up to date. Nothing fails, nobody gets an update, and the cause is invisible
  # from the outside. Cheaper to refuse the tag.
  check-version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $tag, package.json says $manifest." \
                 "Bump the version in package.json, commit it, then move the tag."
            exit 1
          fi
          echo "ok: $GITHUB_REF_NAME builds $manifest"

  # macOS is build-only until signing and notarisation are decided. It runs FIRST and publishes
  # nothing: an unsigned .dmg on a release page invites people to install something macOS will
  # refuse to open. Its job is to prove the tag still builds for macOS.
  verify-mac:
    name: Verify macOS build
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run dist:mac

  # Secrets are not readable in a job-level `if`, so the decision is made once here and passed
  # on as an output. Until the SignPath Foundation application is approved and the secrets are
  # set, the unsigned path below runs exactly as it always has — adding the signing pipeline
  # must not be able to break a release.
  signing-mode:
    name: Determine signing mode
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing enabled: SignPath secrets are present."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing disabled: SignPath secrets are not set; publishing unsigned."
          fi

  release-windows:
    name: Publish Windows release (unsigned)
    if: needs.signing-mode.outputs.enabled != 'true'
    # Serialised on purpose. Two jobs publishing to the same GitHub release in parallel race each
    # other over the release draft and its latest.yml.
    needs: [check-version, verify-mac, signing-mode]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run verify:no-elevate

      # electron-builder runs one publisher per target — nsis and portable — concurrently, and each
      # creates the release lazily when it first needs it. If the release does not exist yet, both
      # see "release doesn't exist" and both POST /releases: one wins, the other comes back 422
      # "Published releases must have a valid tag" and abandons its uploads. v0.2.0 went out exactly
      # that way — published, holding a blockmap and nothing else. No installer, no latest.yml, and
      # a release page that looks finished from the outside.
      #
      # The note above about serialising jobs concerns a different race, between jobs. This one is
      # inside a single electron-builder run and no amount of job ordering touches it. Creating the
      # release first removes it outright: every publisher then finds one and only uploads. It is
      # also what the signed path below already does.
      #
      # --target pins the tag to the commit being built, which is the other half of the 422: GitHub
      # will not create a tag for a published release when nothing says where to anchor it, and
      # electron-builder sends no target_commitish.
      - name: Ensure the release exists before anything uploads into it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; publishing into it"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$version" --generate-notes
            echo "created release $tag at $GITHUB_SHA"
          fi

      - name: Publish to GitHub Releases
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-discovery would otherwise pick up whatever happens to be in the runner keychain
          # and make builds non-deterministic.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify the published build carries no elevation helper
        run: npm run verify:no-elevate

      # The v0.2.0 failure was loud in the log and silent on the release page: the job exited 1, and
      # what it left behind still looked like a finished release. Nothing downstream reads exit
      # codes — people and electron-updater read the release. So the last word belongs to the
      # release itself.
      - name: Verify the release carries what a user actually needs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          have="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          echo "$have"
          missing=""
          for want in WatIs-Setup-x64.exe WatIs-Setup-x64.exe.blockmap WatIs-Portable-x64.exe latest.yml; do
            grep -qx "$want" <<<"$have" || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "::error::$tag is published but missing:$missing"
            exit 1
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "::error::$tag is still a draft, so /releases/latest/download/ cannot see it"
            exit 1
          fi
          # latest.yml is the file every installed client reads to decide whether to update. A
          # version in there that disagrees with the tag means nobody ever updates, silently.
          got="$(curl -fsSL "https://github.com/phish3144/watis/releases/download/$tag/latest.yml" |
                 grep '^version:' | awk '{print $2}')"
          if [ "$got" != "$version" ]; then
            echo "::error::latest.yml on $tag says $got, expected $version"
            exit 1
          fi
          echo "ok: $tag carries all four assets and latest.yml says $version"

  # Two-phase build, because SignPath cannot reach into an NSIS installer's payload: NSIS is not
  # one of its container formats. So the application is signed first, and the installers are then
  # built around the already-signed binary and signed in turn.
  #
  # Each SignPath request blocks on a human clicking "Approve" — the Foundation terms require it
  # ("Every release needs manual approval for signing"), so a release takes two approvals.
  release-windows-signed:
    name: Publish Windows release (signed)
    if: needs.signing-mode.outputs.enabled == 'true'
    needs: [check-version, verify-mac, signing-mode]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run verify:no-elevate

      # --- phase 1: the application ------------------------------------------------------
      - name: Build unpacked application
        run: npm run dist:win:unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The archive holds the directory CONTENTS, so paths inside match .signpath/app.xml.
      - name: Pack the unpacked application for signing
        shell: bash
        run: 7z a -tzip app-to-sign.zip ./release/win-unpacked/*

      - uses: actions/upload-artifact@v7
        id: upload-app
        with:
          name: app-to-sign
          path: app-to-sign.zip

      - name: Sign the application
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: watis
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          # An approval needs a human at a keyboard; ten minutes is not enough.
          wait-for-completion-timeout-in-seconds: '3600'
          # Extracted straight back over the build output, so the installers below are built
          # from the signed binary rather than the original one.
          output-artifact-directory: release/win-unpacked

      # --- phase 2: the installers -------------------------------------------------------
      # electron-builder writes app-update.yml from its afterPack hook, which neither phase
      # reaches: `doPack` returns early under --prepackaged, and a --dir build does not satisfy
      # the nsis-target condition either. Without this step the app installs and never updates.
      - name: Write app-update.yml
        run: npm run release:app-update-yml -- release/win-unpacked "SignPath Foundation"

      - name: Build installers from the signed application
        run: npm run dist:win:prepackaged
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify the built installers carry no elevation helper
        run: npm run verify:no-elevate

      - name: Pack the installers for signing
        shell: bash
        run: 7z a -tzip installers-to-sign.zip ./release/WatIs-Setup-x64.exe ./release/WatIs-Portable-x64.exe

      - uses: actions/upload-artifact@v7
        id: upload-installers
        with:
          name: installers-to-sign
          path: installers-to-sign.zip

      - name: Sign the installers
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: watis
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: release

      # Signing changed the bytes, so every hash electron-builder recorded while packing is now
      # wrong and electron-updater would reject the update. Rebuild the blockmap and latest.yml
      # against the signed files.
      - name: Refresh release metadata against the signed binaries
        run: npm run release:refresh-metadata

      - name: Upload the signed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "${TAG#v}" --generate-notes
          gh release upload "$TAG" \
            release/WatIs-Setup-x64.exe \
            release/WatIs-Setup-x64.exe.blockmap \
            release/WatIs-Portable-x64.exe \
            release/latest.yml \
            --clobber
