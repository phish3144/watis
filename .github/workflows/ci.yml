name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # better-sqlite3 13 is Node-API and ships prebuilds for every target inside its npm tarball.
  # Nothing in this project needs a native rebuild, so no Python or MSVC toolchain is installed.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  verify:
    name: Lint, types, unit tests (${{ matrix.os }})
    # Unit tests run on Windows too. They touch path handling, and path.join uses a different
    # separator there — a test that hardcodes POSIX separators passes on Linux and fails on
    # Windows. Running them only on ubuntu meant that class of bug surfaced at release time
    # instead of on the push that introduced it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The no-admin-rights constraint is a release gate, not a hope. This fails the build if
      # anyone flips an NSIS flag that would reintroduce an elevation path.
      - if: runner.os == 'Linux'
        run: npm run verify:no-elevate

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Electron needs a display. Linux runners are headless, Windows runners are not.
      - name: Run E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
      - name: Run E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  extension:
    name: Browser extension (Chromium, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The full Chromium, not the headless shell: only the full build loads extensions.
      - run: npx playwright install --with-deps chromium
      # A real speech model for the transcription tests, fetched from whisper.cpp's own repository
      # and checked against the SHA-256 pinned in the repo. It never changes for a given pin, so it
      # is cached rather than downloaded on every push.
      - uses: actions/cache@v6
        with:
          path: .cache/whisper
          key: whisper-${{ hashFiles('src/extension/whisper-models.json') }}
      - run: npm run models:fetch -- base
      - run: npm run test:extension
      # Firefox comes with the Ubuntu runner. Playwright's own Firefox cannot load extensions, so
      # this check drives a release Firefox over WebDriver BiDi (scripts/e2e-firefox-extension.mjs).
      - run: FIREFOX="$(command -v firefox)" npm run test:extension:firefox
      - run: npm run pack:extension
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: out/extension/*.zip
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-extension
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the release target: its installers are kept as artefacts.
          - os: windows-latest
            script: dist:win
            artifact: windows-installers
          # macOS is build-only but a REQUIRED check. It is what stops the project from being
          # quietly broken for macOS by a Windows-only change.
          - os: macos-latest
            script: dist:mac
            artifact: macos-builds
          # Linux for the same reason, and with more at stake: it is a release target now, and the
          # AppImage is the only build whose packaging can be exercised on the machine that runs
          # the E2E suite.
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux-appimage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Electron's ~100 MB binary is downloaded on every npm ci otherwise.
      - uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci

      # Catches a regression from Node-API prebuilds back to a source build immediately, rather
      # than when a user's install fails.
      - name: Smoke test — better-sqlite3 loads under Electron without a rebuild
        run: npm run smoke:sqlite

      - name: Build and package
        run: npm run ${{ matrix.script }}
        env:
          # Never publish from CI. Releases are cut from a tag by release.yml.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify the packaged app carries no elevation helper
        if: runner.os == 'Windows'
        run: npm run verify:no-elevate

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
          retention-days: 14
          if-no-files-found: warn
